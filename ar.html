<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>F1 COTA Austin · Android &amp; iOS Tabletop AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 35%, #232c38 0%, #10151c 100%);
      color: #f4f6f8;
    }
    model-viewer {
      width: 100%; height: 100%;
      --poster-color: transparent;
      --progress-bar-color: #e10600;
      --progress-bar-height: 3px;
    }
    .top-bar {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: 16px; right: 16px;
      z-index: 20;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      pointer-events: none;
    }
    .back-link {
      pointer-events: auto;
      padding: 8px 14px; border-radius: 999px;
      background: rgba(13, 18, 26, 0.78);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.14);
      color: #fff; font-size: 13px; font-weight: 600;
      text-decoration: none;
    }
    .status-pill {
      padding: 7px 12px; border-radius: 999px;
      background: rgba(13, 18, 26, 0.74);
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 12px; color: rgba(244,246,248,0.84);
    }

    /* Invisible 3D reference hotspots projected by <model-viewer> (works live inside WebXR AR!) */
    .ref-dot {
      width: 1px; height: 1px;
      border: none; padding: 0; margin: 0;
      background: transparent;
      opacity: 0; pointer-events: none;
    }

    /* Dynamic Visual Scale Overlay — lives INSIDE <model-viewer> so Chrome WebXR renders it right in AR! */
    .scale-hud {
      position: fixed;
      top: max(62px, calc(env(safe-area-inset-top) + 46px));
      right: 16px;
      z-index: 25;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(13, 18, 26, 0.76);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.14);
      color: #f4f6f8;
      min-width: 126px;
    }
    .scale-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .scale-sub {
      font-size: 10px;
      color: rgba(244,246,248,0.74);
      white-space: nowrap;
    }
    .scale-bar-wrap {
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      height: 10px;
      margin: 1px 0;
    }
    .scale-bar {
      width: 96px;
      height: 8px;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #ffffff;
      border-bottom: 2.5px solid #e10600;
      position: relative;
      transition: width 0.08s linear;
    }
    .scale-bar::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 1.5px;
      height: 5px;
      background: rgba(255,255,255,0.68);
      transform: translateX(-50%);
    }

    /* Hide back link / extra buttons while in active WebXR AR session; keep scale HUD visible! */
    model-viewer[ar-status="session-started"] .scale-hud,
    model-viewer[ar-status="object-placed"] .scale-hud {
      top: max(18px, env(safe-area-inset-top));
      right: 14px;
      background: rgba(10, 14, 20, 0.68);
    }

    .ar-btn {
      position: fixed;
      bottom: max(68px, calc(env(safe-area-inset-bottom) + 52px));
      left: 50%; transform: translateX(-50%);
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 26px; border: none; border-radius: 999px;
      background: #e10600; color: #fff;
      font-size: 15px; font-weight: 700; letter-spacing: 0.02em;
      cursor: pointer; white-space: nowrap;
      box-shadow: 0 10px 28px rgba(225, 6, 0, 0.45);
    }
    .ar-btn svg { width: 20px; height: 20px; fill: currentColor; }

    .android-alt {
      position: fixed;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%);
      z-index: 20;
      display: none;
      align-items: center; gap: 8px;
      padding: 8px 16px; border-radius: 999px;
      background: rgba(13, 18, 26, 0.80);
      border: 1px solid rgba(255,255,255,0.18);
      color: #f4f6f8; font-size: 12px; font-weight: 600;
      text-decoration: none; white-space: nowrap;
    }
    .android-alt.show { display: inline-flex; }
    .desktop-note {
      position: fixed;
      bottom: max(22px, env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%);
      padding: 8px 16px; border-radius: 999px;
      background: rgba(13, 18, 26, 0.74);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(244,246,248,0.80); font-size: 12px;
      white-space: nowrap; display: none;
    }
    body.no-ar .desktop-note { display: block; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a class="back-link" href="./">← Back to Onboard &amp; 3D View</a>
    <div class="status-pill" id="ar-status">Loading COTA AR…</div>
  </div>

  <!-- Pure Core glTF 2.0 (4 materials, 0 extensions) + Native USDZ + Live WebXR DOM Scale Overlay -->
  <model-viewer
    id="mv"
    src="assets/cota_austin_scaled.glb?v=3"
    ios-src="assets/cota_austin_scaled.usdz?v=3"
    poster="assets/poster.png?v=3"
    alt="True-scale Circuit of the Americas Austin Texas F1 Tabletop AR Diorama"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="auto"
    autoplay
    camera-controls
    touch-action="pan-y"
    camera-orbit="-24deg 56deg 115%"
    shadow-intensity="1"
    shadow-softness="0.85"
    exposure="1.08"
    tone-mapping="neutral"
  >
    <!-- 3 invisible 3D anchors (50m real COTA = 0.19m model units apart along X & Z) for live AR zoom/move scale projection -->
    <button slot="hotspot-ref-o" id="ref-o" class="ref-dot" data-position="0 0.05 0" data-normal="0 1 0" tabindex="-1" aria-hidden="true"></button>
    <button slot="hotspot-ref-x" id="ref-x" class="ref-dot" data-position="0.19 0.05 0" data-normal="0 1 0" tabindex="-1" aria-hidden="true"></button>
    <button slot="hotspot-ref-z" id="ref-z" class="ref-dot" data-position="0 0.05 0.19" data-normal="0 1 0" tabindex="-1" aria-hidden="true"></button>

    <!-- Live Rough Visual Scale HUD (stays visible right inside Chrome WebXR AR as you zoom & walk around!) -->
    <div class="scale-hud" id="scale-hud">
      <div class="scale-label" id="scale-label">~50 m track</div>
      <div class="scale-bar-wrap"><div class="scale-bar" id="scale-bar"></div></div>
      <div class="scale-sub" id="scale-sub">~19 cm table · ~9 F1 cars</div>
    </div>

    <button slot="ar-button" class="ar-btn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2L3 7v10l9 5 9-5V7l-9-5zm0 2.18L18.74 8 12 11.82 5.26 8 12 4.18zM5 9.65l6 3.33v6.54l-6-3.33V9.65zm8 9.87v-6.54l6-3.33v6.54l-6 3.33z"/></svg>
      Launch Tabletop AR
    </button>
  </model-viewer>

  <!-- Direct Android ARCore Scene Viewer fallback (com.google.ar.core) -->
  <a id="scene-viewer-alt" class="android-alt" href="#">Open in Google Scene Viewer (ARCore)</a>
  <div class="desktop-note">Open in Chrome (Android) or Safari (iPhone) for Tabletop AR · 3D 100m ruler on board</div>

  <script>
    const mv = document.getElementById('mv');
    const statusEl = document.getElementById('ar-status');
    const altBtn = document.getElementById('scene-viewer-alt');
    const scaleBar = document.getElementById('scale-bar');
    const scaleLabel = document.getElementById('scale-label');
    const scaleSub = document.getElementById('scale-sub');
    const refO = document.getElementById('ref-o');
    const refX = document.getElementById('ref-x');
    const refZ = document.getElementById('ref-z');

    const isAndroid = /Android/i.test(navigator.userAgent || '');
    const REAL_M_TO_MODEL = 0.0038; // 1:263 COTA scale (50m real = 0.19m model)
    const NICE_STEPS_M = [2, 5, 10, 20, 25, 50, 100, 200, 250, 500];

    if (isAndroid) {
      const glbAbs = new URL('assets/cota_austin_scaled.glb?v=3', window.location.href).href;
      altBtn.href = `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(glbAbs)}&mode=ar_preferred&resizable=true&title=${encodeURIComponent('F1 COTA Austin Tabletop AR')}#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=${encodeURIComponent(window.location.href)};end;`;
      altBtn.classList.add('show');
    }

    function updateVisualScale() {
      let pxPerRealMeter = 0;

      // Method 1: Measure live screen-projected 3D hotspots (works accurately in BOTH 3D & WebXR AR during walk/pinch-zoom!)
      const ro = refO.getBoundingClientRect();
      const rx = refX.getBoundingClientRect();
      const rz = refZ.getBoundingClientRect();
      const validO = (ro.left !== 0 || ro.top !== 0);
      if (validO) {
        const dx = Math.hypot(rx.left - ro.left, rx.top - ro.top);
        const dz = Math.hypot(rz.left - ro.left, rz.top - ro.top);
        const px50m = Math.max(dx, dz);
        if (px50m > 6 && px50m < window.innerWidth * 8) {
          pxPerRealMeter = px50m / 50.0;
        }
      }

      // Method 2: Fallback via camera orbit radius & vertical FOV
      if (pxPerRealMeter <= 0 && typeof mv.getCameraOrbit === 'function' && typeof mv.getFieldOfView === 'function') {
        const orbit = mv.getCameraOrbit();
        const fovDeg = mv.getFieldOfView();
        if (orbit && orbit.radius > 0.01 && fovDeg > 1) {
          const hPx = mv.clientHeight || window.innerHeight;
          const pxPerModelMeter = hPx / (2 * orbit.radius * Math.tan((fovDeg * Math.PI) / 360));
          pxPerRealMeter = pxPerModelMeter * REAL_M_TO_MODEL;
        }
      }

      if (pxPerRealMeter <= 0) return;

      // Pick the cleanest round COTA distance fitting comfortably in ~70-150px
      const targetPx = 104;
      let bestM = 50;
      let bestErr = Infinity;
      for (const m of NICE_STEPS_M) {
        const w = m * pxPerRealMeter;
        if (w >= 54 && w <= 170) {
          const err = Math.abs(w - targetPx);
          if (err < bestErr) { bestErr = err; bestM = m; }
        }
      }
      if (bestErr === Infinity) {
        bestM = (targetPx / pxPerRealMeter < 5) ? 2 : 500;
      }

      const barPx = Math.max(44, Math.min(180, Math.round(bestM * pxPerRealMeter)));
      const cars = Math.max(0.4, bestM / 5.4);
      const carsStr = cars < 2 ? `${cars.toFixed(1)} F1 car` : `~${Math.round(cars)} F1 cars`;
      const tableCm = bestM * REAL_M_TO_MODEL * 100;
      const tableStr = tableCm >= 100 ? `~${(tableCm / 100).toFixed(1)} m` : `~${Math.round(tableCm)} cm`;

      scaleBar.style.width = `${barPx}px`;
      scaleLabel.textContent = `~${bestM} m track`;
      scaleSub.textContent = `${carsStr} · ${tableStr} @ 100%`;
    }

    let inAR = false;
    function tick() {
      updateVisualScale();
      if (inAR) requestAnimationFrame(tick);
    }

    mv.addEventListener('camera-change', updateVisualScale);
    mv.addEventListener('load', () => {
      updateVisualScale();
      if (mv.canActivateAR) {
        statusEl.textContent = isAndroid ? 'Android WebXR / ARCore Ready' : 'Tabletop AR Ready';
      } else {
        statusEl.textContent = '3D Preview Mode';
        document.body.classList.add('no-ar');
      }
    });
    mv.addEventListener('ar-status', (e) => {
      const s = e.detail.status;
      inAR = (s === 'session-started' || s === 'object-placed');
      if (inAR) requestAnimationFrame(tick);
      if (s === 'failed') {
        statusEl.textContent = isAndroid ? 'Try Google Scene Viewer below' : 'AR unavailable on this browser';
      }
    });
    window.addEventListener('resize', updateVisualScale);
  </script>
</body>
</html>
